[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omop-mini-etl"
version = "0.1.0"
description = "Small ETL from synthetic primary care data to the OMOP CDM"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy", "duckdb"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
omop-etl = "omop_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
